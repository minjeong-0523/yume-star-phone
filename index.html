  <style>

    .bg-star{pointer-events:none;position:fixed;color:#ffbfdd;opacity:.62;filter:drop-shadow(0 2px #fff);font-size:32px;animation:twinkle 5s ease-in-out infinite;z-index:-1}.bg-star:nth-of-type(2){left:6%;top:65%;font-size:48px;animation-delay:-2s}.bg-star:nth-of-type(3){left:77%;top:15%;font-size:52px;color:#ffe897;animation-delay:-1s}.bg-star:nth-of-type(4){left:90%;top:77%;color:#e8adfc;animation-delay:-3s}

    .messages-bg{background:linear-gradient(180deg,#ddf8ff,#fff4fb);display:flex;flex-direction:column;height:100%;min-height:0}.list-heading{padding:11px 11px 8px;display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:900;color:#ba63aa}.thread-row{display:flex;gap:10px;align-items:center;padding:12px 10px;border:0;border-bottom:1px solid #f4cce8;background:#ffffffb7;text-align:left;width:100%;cursor:pointer}.thread-row:hover{background:#fff2fb}.avatar{width:40px;height:40px;flex:none;border-radius:13px;display:grid;place-items:center;font-size:23px;color:#fff;border:2px solid white;box-shadow:0 2px 0 #e1abd0}.av-rola{background:linear-gradient(145deg,#9f84e9,#eaa2d8)}.av-koharu{background:linear-gradient(145deg,#ffc061,#f59cc8)}.av-ako{background:linear-gradient(145deg,#90d8ee,#b5b2ec)}.av-yume{background:linear-gradient(145deg,#f777b5,#ffc8e3)}.thread-text{min-width:0;flex:1}.thread-text strong{font-size:12px;color:#986083}.thread-text p{font-size:10px;color:#ab86a5;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;margin:3px 0 0}.thread-time{font-size:9px;color:#b98baa;align-self:flex-start}.unread-dot{width:15px;height:15px;background:#fc4ca0;color:white;border-radius:50%;display:grid;place-items:center;font-size:9px;margin-top:6px}.chat-bg{display:flex;flex-direction:column;background:linear-gradient(150deg,#e4faff,#f3edff);height:100%;min-height:0}.chat-contact{text-align:center;font-size:10px;color:#b490ae;padding:5px;background:#fff7fcaf}.bubble-list{flex:1;overflow-y:auto;min-height:0;padding:8px 8px 14px;display:flex;flex-direction:column;gap:8px}.bubble-row{display:flex;gap:5px;align-items:end}.bubble-row.mine{justify-content:end}.bubble{font-size:11px;line-height:1.6;max-width:80%;padding:9px 10px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 2px 0 #dfc2dc}.bubble-row.them .bubble{background:white;border-radius:4px 14px 14px 14px;color:#896b91}.bubble-row.mine .bubble{background:#ffa     /* ===== Stitch Design Integration | UI is adapted from the 2 supplied Stitch HTML screens. ===== */
:root { --stitch-cream:#fff3c5; --stitch-rose:#ff2b92; --stitch-sky:#6fe1fa; }
body{
  background:radial-gradient(circle at 86% 8%,#ffe3f1 0,transparent 31%),
             radial-gradient(circle at 14% 86%,#e7e6ff 0,transparent 30%),
             linear-gradient(143deg,#fff3c4,#fff6e5 48%,#f7e2f5 100%);
}
.world { max-width:1200px;grid-template-columns:minmax(285px,1fr) minmax(400px,1fr) }
.intro .eyebrow{background:#fff9e1;border-color:#ffdfa0;color:#b77660}
.intro h1{color:#f72b94;text-shadow:3px 3px #fff,5px 6px #ffd4ac}
.intro h1 span{color:#c270b2}
.intro .accent{color:#e93897}
.usage button{border-color:#ffd0e7;background:#fff9fd;color:#a7548e}
.aside-note{background:#fffaf4d6;color:#91778b}
.orbit{background:radial-gradient(ellipse,#ffe9a8 0%,#ffecdc 35%,transparent 70%)}
.device-shadow{background:#a5775344}
.device{
  --w:min(395px,calc(100vw - 23px),calc((100dvh - 24px)*.548));
  aspect-ratio:.548;
  transform:none;
  border:7px solid #d8a625;
  border-radius:39px;
  background:linear-gradient(135deg,#fff7c6 0%,#fbe168 17%,#daa12d 45%,#ba7c14 55%,#fff4ab 77%,#d19920 100%);
  box-shadow:inset 1px 1px 3px #fff6c9,inset -2px -2px 3px #8e6818,
     0 0 0 3px #ffefa3,0 19px 0 #c8599d,0 28px 45px #975a8b52,
     0 35px 75px #a6804a50;
}
.device:hover{transform:none}
.device::before{inset:5px;border:2px dotted #fff6b5;border-radius:31px;z-index:8}
.device-inner{
  inset:7px 7px 9px;border-radius:31px;border:2px solid #ffe7a0;
  background:repeating-linear-gradient(45deg,#fff8 0 12px,transparent 12px 24px),
    repeating-linear-gradient(-45deg,#ffd5ed80 0 12px,#fa65b280 12px 24px),
    linear-gradient(145deg,#ffb5db 0,#fa4eaa 60%,#e32680 100%);
  box-shadow:inset 0 0 12px #fff9,inset 0 0 4px #fff;
}
.device-inner::before{inset:5px;border:2px solid #fffc;opacity:.7;border-radius:28px}
.corner{width:35px;height:35px;clip-path:polygon(0 0,100% 0,48% 48%,0 100%);background:linear-gradient(135deg,#fff9d0,#e6b329 63%,#a87516);opacity:.97;filter:none}
.corner::after{content:'✦';font-size:15px;color:#fff3b1;left:8px;top:5px}
.faceplate{
  inset:19px 23px 22px;
  grid-template-rows:73px minmax(0,1fr) 104px;
  background:linear-gradient(160deg,#202025,#0f0c12 50%,#221923);
  padding:0 2px 5px;
  border-radius:26px;
  clip-path:none;
  border:2px solid #8b6319;
  box-shadow:inset 0 0 10px #000e,0 2px 2px #492c3c;
}

    const contains=(...terms)=>terms.some(t=>text.includes(t));
    if(id==='rola'){
      if(contains('라이브','무대','노래','연습'))return '좋아, 유메! 우리 둘이 함께라면 최강이잖아! 다음 라이브가 기대되는걸!';
      if(contains('승부','대결','이기','져','지지'))return '좋아, 승부야! 다음엔 내가 절대 지지 않을 거니까!';
    }
    if(id==='koharu'){
      if(contains('드레스','코디','옷','시착','베리'))return '응, 유메 쨩! 레인보우 베리 파르페의 드레스를 같이 입어보자 ♡';
      if(contains('일정','시간','오늘','만나'))return '유메 쨩, 오늘 오후에는 괜찮아! 같이 만나면 정말 좋겠다 ♡';
    }
    if(id==='mahiru'){
      if(contains('스타일','코디','옷','배우'))return '좋아, 유메. 스타일링은 기본부터 차근차근 알려줄게. 내 방으로 와줘.';
      if(contains('머핀','간식','초코','먹'))return '응, 연습이 끝나면 같이 초코 머핀을 먹으러 가자. 기대하고 있을게.';
    }
    if(id==='ako'){
      if(contains('연기','대사','연습'))return '연기 연습을 봐달라고요? 정말 어쩔 수 없군요! 사오토메 아코가 특별히 도와드릴게요!';
      if(contains('일정','시간','오늘','만나'))return '마침 일정에 대해 이야기하려던 참이었어요. 지금 시간 있으신가요, 유메?';
    }
    const replies=contacts[id].replies;
    return replies[Math.floor(Math.random()*replies.length)];
  }
  function replyLater(id,sentText){
    const response=contextualReply(id,sentText);
    setTimeout(()=>{if(!state.chats[id])return;receiveMessage(id,response);},2600+Math.floor(Math.random()*1100));
  }
  // On-page simulated mail arrivals; no messages are sent by a real service.
  const automaticMail=()=>{if(!document.hidden)receiveMessage();};
  setTimeout(automaticMail,16000);
  setInterval(automaticMail,45000);
  function updateTime(){$('#timeNow').textContent=stamp();}updateTime();setInterval(updateTime,30000);
  document.addEventListener('click',e=>{
    const btn=e.target.closest('[data-app],[data-action]');if(!btn)return;
    if(btn.dataset.app){navigate(btn.dataset.app);return;}
    const act=btn.dataset.action,id=btn.dataset.id;
    if(act==='open-thread'){openThread(id);return;}
    if(act==='receive-message'){receiveMessage();return;}
    if(act==='mail-inbox'){state.mailMode='inbox';renderMessages();return;}
    if(act==='mail-folder'){state.mailFolder=btn.dataset.folder==='sent'?'sent':'received';state.mailMode='inbox';renderMessages();return;}
    if(act==='mail-open'){showMail(id,Number(btn.dataset.index));return;}
    if(act==='mail-delete'){
      const list=state.chats[state.thread];
      const item=list?.[state.mailIndex];
      if(!item)return;
      if(window.confirm('이 편지를 삭제할까요? (이 기기에서만 삭제됩니다)')){
        list.splice(state.mailIndex,1);
        state.mailFolder=item.by==='mine'?'sent':'received';
        state.mailMode='inbox';
        persist();renderMessages();flash('편지를 삭제했어요.');
      }
      return;
    }
    if(act==='mail-compose'){state.mailMode='compose';state.mailDraftTo=state.thread||'rola';state.mailDraftTitle='';renderMessages();return;}
    if(act==='mail-reply'){state.mailMode='compose';state.mailDraftTo=state.thread||'rola';const oldMail=state.chats[state.mailDraftTo]?.[state.mailIndex];const oldTitle=oldMail?displayMailTitle(oldMail):'No title';state.mailDraftTitle=oldTitle==='No title'?'':(oldTitle.startsWith('Re: ')?oldTitle:'Re: '+oldTitle);renderMessages();return;}
    if(act==='contacts-tab'){state.phoneMode='contacts';renderPhone();return;}
    if(act==='dial-tab'){state.phoneMode='dial';renderPhone();return;}
    if(act==='digit'){if(state.dial.length<18){state.dial+=btn.dataset.value;renderPhone();}return;}
    if(act==='erase'){state.dial=state.dial.slice(0,-1);renderPhone();return;}
    if(act==='call-dial'){if(!state.dial){flash('電話番号を入力してください。');return;}startCall(state.dial,null);return;}
    if(act==='call-contact'){if(contacts[id])startCall(contacts[id].name,id);return;}
    if(act==='incoming-call'){incomingCall(id);return;}
    if(act==='incoming-random'){const who=contactOrder[Math.floor(Math.random()*contactOrder.length)];incomingCall(who);return;}
    if(act==='accept-call'){answerCall();return;}
    if(act==='reject-call'){endCall();flash('着信を拒否しました。');return;}
    if(act==='hangup'){endCall();flash('通話を終了しました。');return;}
    if(state.call && state.call.phase==='connected'){
      if(act==='toggle-call-mute'){state.call.muted=!state.call.muted;renderPhone();return;}
      if(act==='toggle-call-speaker'){state.call.speaker=!state.call.speaker;renderPhone();return;}
      if(act==='toggle-call-keypad'){state.call.keypadOpen=!state.call.keypadOpen;state.call.memoOpen=false;renderPhone();return;}
      if(act==='toggle-call-memo'){state.call.memoOpen=!state.call.memoOpen;state.call.keypadOpen=false;renderPhone();return;}
      if(act==='close-call-panel'){state.call.keypadOpen=false;state.call.memoOpen=false;renderPhone();return;}
      if(act==='call-keypress'){state.call.tones=(state.call.tones||'').slice(-15)+(btn.dataset.value||'');const el=$('#callKeypadDigits');if(el)el.textContent=state.call.tones;return;}
    }
    if(act==='start-camera'){if(state.liveCamera){state.facing=state.facing==='environment'?'user':'environment';}startCamera();return;}
    if(act==='shutter'){shutter();return;}
    if(act==='gallery'){stopCamera();state.cameraMode='gallery';renderCamera();return;}
    if(act==='back-camera'){state.cameraMode='camera';renderCamera();return;}
    if(act==='clear-photos'){if(state.photos.length&&window.confirm('앨범에 저장된 데모 사진을 모두 삭제할까요?')){state.photos=[];persist();renderCamera();}return;}
    if(act==='view-photo'){const ph=state.photos.find(p=>String(p.id)===String(id));if(ph){state.previewPhoto=ph.src;renderCamera();}return;}
    if(act==='close-photo'){state.previewPhoto=null;renderCamera();return;}
    if(act==='kira-filter'){state.kiraFilter=btn.dataset.filter||'all';const scroll=$('#kiraFeed')?.scrollTop||0;renderKira();$('#kiraFeed').scrollTop=scroll;return;}
    if(act==='toggle-kira-compose'){state.kiraComposeOpen=!state.kiraComposeOpen;renderKira();$('#kiraFeed').scrollTop=0;if(state.kiraComposeOpen)$('#postForm textarea')?.focus();return;}
  });
  document.addEventListener('submit',e=>{
    if(e.target.id==='callMemoForm'){
      e.preventDefault();
      if(state.call && state.call.phase==='connected'){
        state.call.memo=e.target.elements.memo.value;
        state.call.memoOpen=false;
        renderPhone();
        flash('通話メモを保存しました。');
      }
      return;
    }
    if(e.target.id==='mailForm'){e.preventDefault();const id=e.target.elements.recipient.value,msg=e.target.elements.message.value.trim();const title=e.target.elements.title.value.trim()||'No title';if(!contacts[id]||!msg)return;state.chats[id]??=[];state.chats[id].push({by:'mine',title,text:msg,time:stamp(),ts:Date.now()});state.thread=id;state.mailMode='detail';state.mailIndex=state.chats[id].length-1;state.mailDraftTitle='';persist();renderMessages();flash(`${contacts[id].name}에게 메시지를 보냈어요! ✉`);replyLater(id,msg);return;}
    if(e.target.id==='postForm'){
      e.preventDefault();
      const text=e.target.elements.post.value.trim();
      if(!text)return;
      const authorType=e.target.elements.authorType?.value||'yume';
      const post=authorType==='fan'
        ? {id:Date.now(),who:'fan_custom',name:'ファン',mark:'💫',type:'fan',badge:'팬',time:'방금 전',text,art:''}
        : {id:Date.now(),who:'yume',name:'니지노 유메',mark:'🌈',type:'idol',badge:'아이돌',time:'방금 전',text,art:''};
      state.posts.unshift(post);
      state.kiraFilter='all';
      state.kiraComposeOpen=false;
      persist();
      renderKira();
      flash(authorType==='fan'?'팬 계정으로 새 글을 올렸어요! ✨':'유메 계정으로 새 글을 올렸어요! ✨');
      return;
    }
  });
  document.addEventListener('change',e=>{if(e.target.id==='photoUpload'&&e.target.files?.[0])loadFile(e.target.files[0]);});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.previewPhoto){state.previewPhoto=null;renderCamera();}});
  render();
})();
</script>
</body>
</html>
